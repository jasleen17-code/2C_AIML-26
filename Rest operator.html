<!DOCTYPE html>
<html>
    <head>
        <script>

            let first="Jasleen";
            let last="Kaur";
            console.log(`my name is ${first} ${last}`);

            let fullName=`my name is ${first} ${last}`;
            console.log(fullName);

            function getFullName(first,last)
            {
                return `${first} ${last}`
            }
            let name= `Hello ${getFullName("Jasleen","Kaur")}`;
            console.log(name);

            // arrow function

            fullName=(first,last) => 
            {
                return `${first} ${last}`
            }
            console.log(fullName("Jasleen","Kaur"));

            //REST OPERATOR

            function sum(...values)
            {
            console.log(values);
            }
            sum(10,20,30);

            //for adding the values with rest operator

            function sum(...values)
            {
                let total=0;
                for(let n of values){
                    total=total+n;
                }
                console.log(total);
            }
            sum(10,20,30);
        

        </script>
    </head>
</html>
