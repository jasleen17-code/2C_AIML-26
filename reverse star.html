<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function display()
        {
            let num = parseInt(prompt("enter number of rows"));
            for(let i =1;i<=num; i++)
            {
                for(let j=1; j<=i;j++)
                {
                document.write("*");

                }
            document.write("<br>");
            }
            for(let k =num-1;k>=1;k--)
            {
                for(let j=1;j<=k;j++)
            {
                document.write("*");
            }
            document.write("<br>");
            }
         }
    </script>
</head>
<body>

    <input type ="button" onclick = " display()" value = "Result">
</body>
</html>
