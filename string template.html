<!DOCTYPE html>
<html>
<head>
    <script>
        let first = "Jasleen";
        let last = "Kaur";

        console.log(`My name is ${first} ${last}`);

        let message = `My name is ${first} ${last}`;
        console.log(message);

        function fullName(first, last) {
            return `${first} ${last}`;
        }

        let name = `Hello ${fullName("Jasleen", "Kaur")}`;
        console.log(name);
    </script>
</head>
</html>
