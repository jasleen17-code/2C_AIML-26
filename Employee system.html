<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        class Employee {
            constructor(id, name, basicSalary) {
                this.id = id;
                this.name = name;
                this.basicSalary = basicSalary;
            }
            calculateSalary() {
                return this.basicSalary;
            }
        }

        class Manager extends Employee {
            constructor(id, name, basicSalary, incentive) {
                super(id, name, basicSalary);
                this.incentive = incentive;
            }
            calculateSalary() {
                return this.basicSalary + this.incentive;
            }
        }

        const employee = new Employee(101, "jasleen", 350000);
        const manager = new Manager(201, "kakul", 50000, 10000);

        console.log(employee.name + "'s salary: " + employee.calculateSalary());
        console.log(manager.name + "'s salary: " + manager.calculateSalary());
    </script>
</head>
<body>
</body>
</html>
